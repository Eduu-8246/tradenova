<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeNova | Deriv Connection</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 15px;
    }
    main {
      max-width: 420px;
      margin: 40px auto;
      padding: 25px;
      background: #192538;
      border-radius: 16px;
    }
    h1 { color: #55dfb5; }
    a { color: #55dfb5; }
  </style>
</head>
<body>
  <main>
    <h1>TradeNova</h1>
    <p id="status">Checking authorization...</p>
    <p id="detail"></p>
    <p><a href="/">Return to TradeNova</a></p>
  </main>

  <script>
  (async () => {
    const status = document.getElementById("status");
    const detail = document.getElementById("detail");
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    if (error) {
      status.textContent = "Deriv authorization failed.";
      detail.textContent = error;
      return;
    }

    if (!code || !state) {
      status.textContent = "Authorization response missing.";
      detail.textContent = "Return to TradeNova and connect again.";
      return;
    }

    const savedState = sessionStorage.getItem("oauth_state");
    const verifier = sessionStorage.getItem("pkce_code_verifier");

    if (!savedState || state !== savedState || !verifier) {
      status.textContent = "Security check failed.";
      detail.textContent =
        "The browser session lost the login security data. Start again in the same browser.";
      return;
    }

    status.textContent = "Completing secure connection...";

    try {
      const response = await fetch("/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          code: code,
          code_verifier: verifier,
          redirect_uri: "https://tradenova-phi.vercel.app/callback"
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Token exchange failed");
      }

      sessionStorage.setItem("tradenova_connected", "true");
      sessionStorage.removeItem("oauth_state");
      sessionStorage.removeItem("pkce_code_verifier");

      status.textContent = "Deriv connection successful!";
      detail.textContent =
        "Authorization completed. Return to TradeNova to continue.";
    } catch (err) {
      status.textContent = "Connection could not be completed.";
      detail.textContent = err.message;
    }
  })();
  </script>
</body>
</html>
