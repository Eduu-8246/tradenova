
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeNova | Deriv Connection</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(90%, 420px);
      padding: 28px;
      box-sizing: border-box;
      border: 1px solid #344258;
      border-radius: 16px;
      background: #192538;
      text-align: center;
    }
    h1 { color: #55dfb5; }
    p { line-height: 1.6; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>TradeNova</h1>
    <p id="status">Checking the Deriv sign-in response…</p>
    <p id="detail"></p>
  </main>

  <script>
    (() => {
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");

      if (error) {
        status.textContent = "Deriv sign-in was not completed.";
        detail.textContent =
          "Please return to TradeNova and try again if you wish.";
        return;
      }

      if (!code || !state) {
        status.textContent = "No complete authorization response found.";
        detail.textContent =
          "Return to TradeNova and start the connection again.";
        return;
      }

      const savedState = sessionStorage.getItem("oauth_state");

      if (!savedState || state !== savedState) {
        status.textContent = "Sign-in verification failed.";
        detail.textContent =
          "The security check did not match. Start again from TradeNova.";
        return;
      }

      status.textContent = "Authorization response received.";
      detail.textContent =
        "Security check passed. Token exchange is not configured yet.";
    })();
  </script>
</body>
</html>
