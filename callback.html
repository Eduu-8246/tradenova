<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeNova | Deriv Connection</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 15px;
    }
    main {
      max-width: 420px;
      margin: 40px auto;
      padding: 25px;
      background: #192538;
      border-radius: 16px;
    }
    h1 { color: #55dfb5; }
  </style>
</head>
<body>
  <main>
    <h1>TradeNova</h1>
    <p id="status">Checking Deriv response...</p>
    <p id="detail"></p>
    <p><a href="/" style="color:#55dfb5">Return to TradeNova</a></p>
  </main>

  <script>
    const status = document.getElementById("status");
    const detail = document.getElementById("detail");
    const params = new URLSearchParams(location.search);

    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    if (error) {
      status.textContent = "Deriv authorization failed.";
      detail.textContent = error;
    } else if (!code || !state) {
      status.textContent = "No authorization response received.";
      detail.textContent =
        "Start again from TradeNova and complete Deriv authorization.";
    } else {
      const savedState = sessionStorage.getItem("oauth_state");

      if (!savedState || state !== savedState) {
        status.textContent = "Security check failed.";
        detail.textContent =
          "Return to TradeNova and start a new connection.";
      } else {
        status.textContent = "Authorization received.";
        detail.textContent =
          "The sign-in response arrived, but account connection is not finished. Token exchange still needs to be configured.";
      }
    }
  </script>
</body>
</html>
