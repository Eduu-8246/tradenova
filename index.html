<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeNova | Deriv Trading</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      width: 85%;
      max-width: 420px;
      padding: 30px 20px;
      background: #162238;
      border-radius: 18px;
    }
    h1 { color: #36d6a5; }
    p { color: #cbd5e1; line-height: 1.6; }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #36d6a5;
      color: #08111e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>TradeNova</h1>
    <p>Connect your Deriv account to continue.</p>
    <button id="connect">Connect to Deriv</button>
    <p id="status" role="status">Ready to connect.</p>
  </main>

  <script>
    const CLIENT_ID = "34FHIu3inyzM68fO3UiBv";
    const REDIRECT_URI = "https://tradenova-phi.vercel.app/callback";

    const button = document.getElementById("connect");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Preparing secure connection...";

      try {
        if (!window.crypto || !window.crypto.subtle) {
          throw new Error("Secure connection unavailable. Open the HTTPS website.");
        }

        const randomBytes = new Uint8Array(32);
        window.crypto.getRandomValues(randomBytes);

        const verifier = btoa(String.fromCharCode(...randomBytes))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");

        const digest = await window.crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(verifier)
        );

        const challenge = btoa(
          String.fromCharCode(...new Uint8Array(digest))
        )
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");

        const stateBytes = new Uint8Array(16);
        window.crypto.getRandomValues(stateBytes);
        const state = Array.from(stateBytes)
          .map(b => b.toString(16).padStart(2, "0"))
          .join("");

        sessionStorage.setItem("pkce_code_verifier", verifier);
        sessionStorage.setItem("oauth_state", state);

        const params = new URLSearchParams({
          response_type: "code",
          client_id: CLIENT_ID,
          redirect_uri: REDIRECT_URI,
          scope: "trade",
          state: state,
          code_challenge: challenge,
          code_challenge_method: "S256"
        });

        window.location.href =
          "https://auth.deriv.com/oauth2/auth?" + params.toString();
      } catch (error) {
        status.textContent = error.message || "Could not start connection.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
