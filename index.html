
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeNova</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }
    main {
      max-width: 480px;
      margin: auto;
      padding: 24px;
      background: #192538;
      border-radius: 16px;
    }
    h1, h2 { color: #55dfb5; }
    button {
      padding: 15px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #55dfb5;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .panel {
      background: #101827;
      padding: 18px;
      margin-top: 22px;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>TradeNova</h1>
    <p>Connect your Deriv account to continue.</p>

    <button id="connect">Connect to Deriv</button>
    <p id="auth-status">Checking connection...</p>

    <section class="panel">
      <h2>Live Market</h2>
      <p>Volatility 100 (1-second) Index</p>
      <h1 id="market-price">Waiting for price...</h1>
      <p id="market-status">Starting market connection...</p>
    </section>
  </main>

  <script>
    const CLIENT_ID = "34FHIu3inyzM68fO3UiBv";
    const REDIRECT_URI =
      "https://tradenova-phi.vercel.app/callback";

    const button = document.getElementById("connect");
    const authStatus = document.getElementById("auth-status");
    const price = document.getElementById("market-price");
    const marketStatus = document.getElementById("market-status");

    function showAuthStatus() {
      const token = sessionStorage.getItem(
        "tradenova_access_token"
      );

      if (token) {
        button.textContent = "Deriv Connected";
        authStatus.textContent =
          "Authorization token received in this browser session. Token validity has not yet been verified.";
      } else {
        button.disabled = false;
        button.textContent = "Connect to Deriv";
        authStatus.textContent = "Not connected.";
      }
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      authStatus.textContent =
        "Starting Deriv authorization...";

      try {
        const bytes =
          crypto.getRandomValues(new Uint8Array(32));

        const verifier = Array.from(bytes)
          .map(b => b.toString(16).padStart(2, "0"))
          .join("");

        const digest = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(verifier)
        );

        const challenge = btoa(
          String.fromCharCode(
            ...new Uint8Array(digest)
          )
        )
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");

        const stateBytes =
          crypto.getRandomValues(new Uint8Array(16));

        const state = Array.from(stateBytes)
          .map(b => b.toString(16).padStart(2, "0"))
          .join("");

        sessionStorage.setItem(
          "pkce_code_verifier", verifier
        );
        sessionStorage.setItem("oauth_state", state);

        const params = new URLSearchParams({
          response_type: "code",
          client_id: CLIENT_ID,
          redirect_uri: REDIRECT_URI,
          scope: "trade",
          state: state,
          code_challenge: challenge,
          code_challenge_method: "S256"
        });

        window.location.href =
          "https://auth.deriv.com/oauth2/auth?" +
          params.toString();

      } catch (error) {
        authStatus.textContent =
          "Could not start authorization. Try again.";
        button.disabled = false;
      }
    });

    showAuthStatus();

    // Public market data does not require an OAuth token.
    let socket;

    try {
      socket = new WebSocket(
        "wss://ws.binaryws.com/websockets/v3"
      );

      socket.onopen = function () {
        marketStatus.textContent =
          "Connected. Requesting live ticks...";

        socket.send(JSON.stringify({
          ticks: "1HZ100V",
          subscribe: 1,
          req_id: 1
        }));
      };

      socket.onmessage = function (event) {
        try {
          const data = JSON.parse(event.data);

          if (data.error) {
            marketStatus.textContent =
              "Market error: " + data.error.message;
            return;
          }

          if (data.tick) {
            price.textContent = data.tick.quote;
            marketStatus.textContent =
              "Live prices updating.";
          }
        } catch (error) {
          marketStatus.textContent =
            "Could not read the market response.";
        }
      };

      socket.onerror = function () {
        marketStatus.textContent =
          "Market connection failed. Waiting for close details...";
      };

      // Show the actual WebSocket close code and reason.
      socket.onclose = function (event) {
        marketStatus.textContent =
          "Connection closed. Code: " + event.code +
          ". Reason: " +
          (event.reason || "Not provided") +
          ". Refresh the page to retry.";
      };

    } catch (error) {
      marketStatus.textContent =
        "Could not start market connection: " +
        (error.message || "Unknown error");
    }
  </script>
</body>
</html>
