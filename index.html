
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeNova | Connect to Deriv</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101827;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 30px 24px;
      border: 1px solid #344258;
      border-radius: 20px;
      background: #192538;
      text-align: center;
    }

    .brand {
      color: #55dfb5;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      background: #55dfb5;
      color: #101827;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
    }

    #status {
      min-height: 24px;
      font-size: 14px;
    }

    footer {
      margin-top: 22px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">TradeNova</div>
    <h1>Connect your Deriv account</h1>
    <p>
      Sign in through Deriv's official authorization page
      to begin connecting your account.
    </p>

    <button id="connect">Connect to Deriv</button>
    <p id="status" role="status"></p>

    <footer>
      Your Deriv password is entered only on Deriv's
      official sign-in page.
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const CLIENT_ID =
        "PASTE_YOUR_REGISTERED_CLIENT_ID_HERE";

      const REDIRECT_URI =
        "https://tradenova-phi.vercel.app/callback";

      const AUTH_URL =
        "https://auth.deriv.com/oauth2/auth";

      const button = document.getElementById("connect");
      const status = document.getElementById("status");

      function base64url(bytes) {
        let binary = "";
        for (const byte of bytes) {
          binary += String.fromCharCode(byte);
        }

        return btoa(binary)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");
      }

      async function connect() {
        if (
          !CLIENT_ID ||
          CLIENT_ID === "PASTE_YOUR_REGISTERED_CLIENT_ID_HERE"
        ) {
          status.textContent =
            "Setup incomplete: add your registered Client ID.";
          return;
        }

        if (!window.crypto?.subtle) {
          status.textContent =
            "Secure browser support is required. Open the HTTPS website in an updated browser.";
          return;
        }

        button.disabled = true;
        status.textContent = "Preparing secure connection…";

        try {
          const random = new Uint8Array(32);
          crypto.getRandomValues(random);

          const verifier = base64url(random);

          const digest = await crypto.subtle.digest(
            "SHA-256",
            new TextEncoder().encode(verifier)
          );

          const challenge = base64url(
            new Uint8Array(digest)
          );

          const stateBytes = new Uint8Array(16);
          crypto.getRandomValues(stateBytes);

          const state = Array.from(stateBytes)
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("");

          sessionStorage.setItem(
            "pkce_code_verifier",
            verifier
          );
          sessionStorage.setItem("oauth_state", state);

          const url = new URL(AUTH_URL);

          url.searchParams.set("response_type", "code");
          url.searchParams.set("client_id", CLIENT_ID);
          url.searchParams.set("redirect_uri", REDIRECT_URI);
          url.searchParams.set("scope", "trade account_manage");
          url.searchParams.set("state", state);
          url.searchParams.set("code_challenge", challenge);
          url.searchParams.set("code_challenge_method", "S256");

          window.location.assign(url.toString());
        } catch (error) {
          status.textContent =
            "Could not start secure sign-in. Please try again.";
          button.disabled = false;
        }
      }

      button.addEventListener("click", connect);
    })();
  </script>
</body>
</html>
