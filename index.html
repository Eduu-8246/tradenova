<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeNova</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 15px;
    }
    main {
      max-width: 420px;
      margin: auto;
      padding: 25px;
      background: #192538;
      border-radius: 16px;
    }
    h1 { color: #55dfb5; }
    button {
      padding: 15px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #55dfb5;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>TradeNova</h1>
    <p>Connect your Deriv account to continue.</p>
<div style="background:#192538;color:white;padding:20px;margin:20px 0;border-radius:12px;">
  <h2 style="color:#55dfb5;">Live Market</h2>
  <p>Volatility 100 Index</p>
  <h1 id="market-price">Connecting...</h1>
  <p id="market-status">Loading live prices...</p>
</div>

<script>
(function () {
  const price = document.getElementById("market-price");
  const status = document.getElementById("market-status");

  // This is a public market-data feed, not your OAuth Client ID.
  // Replace 12345 with your numeric Deriv App ID.
  const APP_ID = "12345";
  const socket = new WebSocket(
    "wss://ws.derivws.com/websockets/v3?app_id=" + APP_ID
  );

  socket.onopen = function () {
    status.textContent = "Connected. Waiting for market price...";
    socket.send(JSON.stringify({
      ticks: "R_100",
      subscribe: 1
    }));
  };

  socket.onmessage = function (event) {
    const data = JSON.parse(event.data);

    if (data.tick) {
      price.textContent = data.tick.quote;
      status.textContent = "Live price updates received";
    }

    if (data.error) {
      status.textContent = "Market error: " + data.error.message;
    }
  };

  socket.onerror = function () {
    status.textContent = "Market connection failed.";
  };

  socket.onclose = function () {
    status.textContent = "Market connection closed.";
  };
})();
</script>
    <button id="connect">Connect to Deriv</button>
    <p id="status">Ready to connect.</p>
  </main>

  <script>
    const CLIENT_ID = "34FHIu3inyzM68fO3UiBv";
    const REDIRECT_URI =
      "https://tradenova-phi.vercel.app/callback";

    const button = document.getElementById("connect");
    const status = document.getElementById("status");

    function showStatus() {
      if (sessionStorage.getItem("tradenova_connected") === "true") {
        button.textContent = "Deriv Authorization Received";
        button.disabled = true;
        status.textContent =
          "Authorization completed for this browser session.";
      }
    }

    showStatus();
if (sessionStorage.getItem("tradenova_connected") === "true") {
  button.disabled = true;
}

    button.addEventListener("click", async () => {
      if (sessionStorage.getItem("tradenova_connected") === "true") {
        showStatus();
        return;
      }

      button.disabled = true;
      status.textContent = "Connecting to Deriv...";

      try {
        const bytes = new Uint8Array(32);
        crypto.getRandomValues(bytes);

        const verifier = btoa(
          String.fromCharCode(...bytes)
        ).replace(/\+/g, "-").replace(/\//g, "_")
         .replace(/=+$/, "");

        const digest = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(verifier)
        );

        const challenge = btoa(
          String.fromCharCode(...new Uint8Array(digest))
        ).replace(/\+/g, "-").replace(/\//g, "_")
         .replace(/=+$/, "");

        const stateBytes = new Uint8Array(16);
        crypto.getRandomValues(stateBytes);
        const state = Array.from(stateBytes)
          .map(b => b.toString(16).padStart(2, "0"))
          .join("");

        sessionStorage.setItem("pkce_code_verifier", verifier);
        sessionStorage.setItem("oauth_state", state);

        const params = new URLSearchParams({
          response_type: "code",
          client_id: CLIENT_ID,
          redirect_uri: REDIRECT_URI,
          scope: "trade",
          state,
          code_challenge: challenge,
          code_challenge_method: "S256"
        });

        location.href =
          "https://auth.deriv.com/oauth2/auth?" + params;
      } catch (error) {
        status.textContent = "Could not start login. Please try again.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
